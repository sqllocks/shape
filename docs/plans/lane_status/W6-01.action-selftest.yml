name: action-selftest
# Runs the composite action of this repository (`uses: ./`) on a fixture project: once where the
# result must be `pass`, once where it must be `fail` (the job's failure is tolerated and asserted).
on:
  pull_request:
    paths:
      - action.yml
      - src/shape/**
      - tests/fixtures/action/**
      - .github/workflows/action-selftest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Shape from this checkout
        run: pip install -e ".[yaml]"

      - name: Action on the project that matches its baseline
        id: pass
        uses: ./
        with:
          shape-version: installed
          project: tests/fixtures/action/pass
          fail-on: drift
          comment: "false"
      - name: Check the outputs and the step summary (pass)
        env:
          VERDICT: ${{ steps.pass.outputs.verdict }}
          FINDINGS: ${{ steps.pass.outputs.findings }}
          COMMENT_PATH: ${{ steps.pass.outputs.comment-path }}
        run: |
          set -eu
          test "$VERDICT" = pass
          test "$FINDINGS" = 0
          grep -q 'shape-pr-comment' "$COMMENT_PATH"
          grep -q 'Verdict: pass' "$GITHUB_STEP_SUMMARY"

      - name: Action on the project that drifted from its baseline
        id: fail
        uses: ./
        continue-on-error: true
        with:
          shape-version: installed
          project: tests/fixtures/action/fail
          fail-on: drift
          comment: "false"
      - name: Check that the job step failed, and the outputs and step summary (fail)
        env:
          OUTCOME: ${{ steps.fail.outcome }}
          VERDICT: ${{ steps.fail.outputs.verdict }}
          FINDINGS: ${{ steps.fail.outputs.findings }}
          COMMENT_PATH: ${{ steps.fail.outputs.comment-path }}
        run: |
          set -eu
          test "$OUTCOME" = failure
          test "$VERDICT" = fail
          test "$FINDINGS" -gt 0
          grep -q 'shape-pr-comment' "$COMMENT_PATH"
          grep -q 'Verdict: fail' "$GITHUB_STEP_SUMMARY"
