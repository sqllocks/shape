name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming]'
      # The Fabric demo tests need Java, PySpark and unixODBC; they run in the fabric-demo job below.
      - run: python -m pytest -q --ignore=tests/demo/fabric
      - run: python -m compileall -q src/shape
      - run: ruff check src tests
  fabric-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: sudo apt-get update -q && sudo apt-get install -y -q unixodbc
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]' -r tests/demo/fabric/requirements.txt
      - run: python -m pytest -q tests/demo/fabric
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install build twine pip-audit
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        with: {name: distributions, path: dist/*}
