name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    # T-06: the full Python 3.11-3.14 matrix on Linux; 3.11 and 3.14 on macOS and Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming]'
      # T-27 scope: src tests plugins benchmarks/vs_spindle rust (only the paths that exist yet).
      - run: ruff check src tests
      - run: ruff format --check src tests
      # [tool.mypy] targets python_version 3.11. On 3.12+ legs pip installs a numpy whose
      # stubs use 3.12-only syntax (`type` statements), which mypy rejects under a 3.11
      # target, so the type check runs on the 3.11 legs (every OS).
      - if: matrix.python == '3.11'
        run: mypy
      - run: python -m compileall -q src/shape
      # The Fabric demo tests need Java, PySpark and unixODBC, and the demo content tests need
      # the pinned Spindle checkout; both run in the fabric-demo job below.
      # --cov-fail-under is the measured coverage (86.55% on P0-06), rounded down.
      - run: >-
          python -m pytest -q -m "not emulator and not live"
          --ignore=tests/demo/fabric --ignore=tests/demo/content
          --cov=shape --cov-fail-under=86
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming]'
      - run: pip-audit --skip-editable
  fabric-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: sudo apt-get update -q && sudo apt-get install -y -q unixodbc
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]' -r tests/demo/fabric/requirements.txt
      # demo/make_data.py reads Spindle's schema and reference data (plan section 1.2); read only.
      - name: Pinned Spindle checkout
        run: |
          git init -q "$RUNNER_TEMP/spindle"
          git -C "$RUNNER_TEMP/spindle" fetch -q --depth 1 https://github.com/sqllocks/spindle 422e78df2267e73bb2fa976267e48cb437861e2f
          git -C "$RUNNER_TEMP/spindle" checkout -q FETCH_HEAD
          echo "SPINDLE_ROOT=$RUNNER_TEMP/spindle" >> "$GITHUB_ENV"
      - run: python -m pytest -q tests/demo/fabric tests/demo/content
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install build twine pip-audit
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: pip-audit
      - uses: actions/upload-artifact@v4
        with: {name: distributions, path: dist/*}
