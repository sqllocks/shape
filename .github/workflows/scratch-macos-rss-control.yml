name: Scratch macOS footprint control
on:
  workflow_dispatch:
permissions: {contents: read}
env:
  REFENGINE_NAME: ${{ secrets.REFENGINE_NAME }}
jobs:
  control:
    runs-on: macos-latest
    env: {PYTHONPATH: ci}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming,advanced,docs]' -e plugins/shape-domains -e plugins/shape-sqlserver -e plugins/shape-eventhubs -e plugins/shape-fabric -e plugins/shape-kafka
      - name: Real measurement and temporary proportional-memory control
        run: python scripts/scratch/macos_footprint_control.py --output "$RUNNER_TEMP/macos-footprint-control"
      - name: Verify checkout restoration
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-footprint-control
          path: ${{ runner.temp }}/macos-footprint-control/
