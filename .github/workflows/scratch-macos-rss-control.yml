name: Scratch macOS allocation proof
on:
  workflow_dispatch:
  # A dispatch needs the file on main; this scratch branch is never merged, so a push runs it.
  push:
    branches: [scratch/macos-rss-control]
permissions: {contents: read}
env:
  REFENGINE_NAME: ${{ secrets.REFENGINE_NAME }}
jobs:
  control:
    runs-on: macos-latest
    timeout-minutes: 120
    env: {PYTHONPATH: ci}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming,advanced,docs]' -e plugins/shape-domains -e plugins/shape-sqlserver -e plugins/shape-eventhubs -e plugins/shape-fabric -e plugins/shape-kafka
      - name: vmmap and heap probe of the 24M-row scan
        run: python scripts/scratch/macos_vmmap_probe.py --output "$RUNNER_TEMP/macos-vmmap-probe" --children 6
      - name: Verify checkout restoration
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-vmmap-probe
          path: ${{ runner.temp }}/macos-vmmap-probe/
