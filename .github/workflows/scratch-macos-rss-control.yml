name: Scratch macOS allocation proof
on:
  workflow_dispatch:
  # A dispatch needs the file on main; this scratch branch is never merged, so a push runs it.
  push:
    branches: [scratch/macos-rss-control]
permissions: {contents: read}
env:
  REFENGINE_NAME: ${{ secrets.REFENGINE_NAME }}
jobs:
  control:
    runs-on: macos-latest
    timeout-minutes: 120
    env: {PYTHONPATH: ci}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming,advanced,docs]' -e plugins/shape-domains -e plugins/shape-sqlserver -e plugins/shape-eventhubs -e plugins/shape-fabric -e plugins/shape-kafka
      - name: Build child malloc tracer
        run: |
          exports="$RUNNER_TEMP/rss-malloc-exports.txt"
          selected=""
          for library in /usr/lib/system/libsystem_malloc.dylib /usr/lib/libSystem.B.dylib; do
            if nm -gU "$library" > "$exports" 2>/dev/null && grep -Eq '[[:space:]]_malloc$' "$exports"; then
              selected="$library"
              break
            fi
          done
          if test -z "$selected"; then
            echo "nm could not find the macOS malloc exports"
            exit 1
          fi
          echo "Checking malloc exports in $selected"
          for symbol in malloc calloc realloc free posix_memalign aligned_alloc malloc_zone_malloc malloc_zone_memalign malloc_zone_realloc malloc_zone_free; do
            if ! grep -Eq "[[:space:]]_${symbol}$" "$exports"; then
              echo "Required macOS malloc symbol missing: $symbol"
              exit 1
            fi
            echo "exported: $symbol"
          done
          flags=()
          for entry in reallocf:RSS_NO_REALLOCF valloc:RSS_NO_VALLOC malloc_zone_calloc:RSS_NO_ZONE_CALLOC; do
            symbol="${entry%%:*}"
            define="${entry#*:}"
            if grep -Eq "[[:space:]]_${symbol}$" "$exports"; then
              echo "exported: $symbol"
            else
              echo "not exported, omitting interposer: $symbol"
              flags+=("-D$define")
            fi
          done
          clang -dynamiclib -O1 -fno-omit-frame-pointer "${flags[@]}" -o "$RUNNER_TEMP/rss_malloc_trace.dylib" scripts/scratch/rss_malloc_trace.c
          clang -O0 -o "$RUNNER_TEMP/rss_malloc_smoke" scripts/scratch/rss_malloc_smoke.c
      - name: Prove the tracer on known large allocations
        run: python scripts/scratch/verify_mac_malloc_trace.py "$RUNNER_TEMP/rss_malloc_trace.dylib" "$RUNNER_TEMP/rss_malloc_smoke" "$RUNNER_TEMP/macos-malloc-smoke"
      - name: Program-allocation matrix and proportional-memory control
        env:
          RSS_TRACE_DYLIB: ${{ runner.temp }}/rss_malloc_trace.dylib
        run: python scripts/scratch/macos_footprint_control.py --matrix --output "$RUNNER_TEMP/macos-program-allocation-proof"
      - name: Arrow and NumPy allocation trace
        if: always()
        run: python scripts/scratch/macos_footprint_control.py --probe-order 24-48 --pool-trace --output "$RUNNER_TEMP/macos-arrow-numpy-trace"
      - name: Verify checkout restoration
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-program-allocation-proof
          path: ${{ runner.temp }}/macos-program-allocation-proof/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arrow-numpy-trace
          path: ${{ runner.temp }}/macos-arrow-numpy-trace/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-malloc-smoke
          path: ${{ runner.temp }}/macos-malloc-smoke/
