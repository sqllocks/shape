name: Scratch macOS allocation proof
on:
  workflow_dispatch:
  # A dispatch needs the file on main; this scratch branch is never merged, so a push runs it.
  push:
    branches: [scratch/macos-rss-control]
permissions: {contents: read}
env:
  REFENGINE_NAME: ${{ secrets.REFENGINE_NAME }}
jobs:
  control:
    runs-on: macos-latest
    timeout-minutes: 120
    env: {PYTHONPATH: ci}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming,advanced,docs]' -e plugins/shape-domains -e plugins/shape-sqlserver -e plugins/shape-eventhubs -e plugins/shape-fabric -e plugins/shape-kafka
      - name: Build the live-heap interposer and smoke test
        run: |
          clang -dynamiclib -O2 -o "$RUNNER_TEMP/rss_live_peak.dylib" scripts/scratch/rss_live_peak.c
          clang -O0 -o "$RUNNER_TEMP/rss_malloc_smoke" scripts/scratch/rss_malloc_smoke.c
          codesign -dvv "$RUNNER_TEMP/rss_live_peak.dylib" || true
      - name: Does the interposer load into this Python and see known allocations
        run: python scripts/scratch/verify_live_peak.py "$RUNNER_TEMP/rss_live_peak.dylib" "$RUNNER_TEMP/rss_malloc_smoke"
      - name: Verify checkout restoration
        if: always()
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-program-allocation-proof
          path: ${{ runner.temp }}/macos-program-allocation-proof/
