name: Wheels
# T-04: abi3 wheels (one per platform) built with PyO3/maturin-action, plus an sdist, each
# installed and smoke-tested on Python 3.11 and 3.14: `import shape; shape._kernel.version()`.
# Nothing is published from here (release is P8-04, by the owner).
on:
  push:
    paths: ['rust/**', 'pyproject.toml', 'src/shape/_kernel.pyi', '.github/workflows/wheels.yml']
  pull_request:
    paths: ['rust/**', 'pyproject.toml', 'src/shape/_kernel.pyi', '.github/workflows/wheels.yml']
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  wheel:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: '2_28', kind: native}
          - {name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28', kind: native}
          - {name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, kind: alpine, platform: linux/amd64}
          - {name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, kind: alpine, platform: linux/arm64}
          # both macOS wheels are cross-compiled on the arm64 runner; the x86_64 one is tested on Intel
          - {name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, kind: native}
          - {name: macos-x86_64, os: macos-14, target: x86_64-apple-darwin, kind: cross}
          - {name: windows-x64, os: windows-latest, target: x64, kind: native}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist
          # the wheel is abi3 (py311+), so one interpreter is enough to build it
      - uses: actions/upload-artifact@v4
        with: {name: 'wheel-${{ matrix.name }}', path: dist/*.whl}
      # --- smoke test on the build machine (native kinds) ---
      - if: matrix.kind == 'native'
        uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - if: matrix.kind == 'native'
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install dist/*.whl
          SHAPE_KERNEL=rust python -c "import shape; print(shape._kernel.version()); from shape.kernel import kernel_name; assert kernel_name() == 'rust'"
      - if: matrix.kind == 'native'
        uses: actions/setup-python@v5
        with: {python-version: '3.14', allow-prereleases: true}
      - if: matrix.kind == 'native'
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install --force-reinstall dist/*.whl
          SHAPE_KERNEL=rust python -c "import shape; print(shape._kernel.version()); from shape.kernel import kernel_name; assert kernel_name() == 'rust'"
      # --- musllinux: install and test inside Alpine ---
      - if: matrix.kind == 'alpine'
        run: |
          for py in 3.11 3.14; do
            docker run --rm --platform ${{ matrix.platform }} -v "$PWD/dist:/dist" "python:${py}-alpine" sh -c '
              apk add --no-cache libstdc++ >/dev/null &&
              pip install /dist/*.whl &&
              SHAPE_KERNEL=rust python -c "import shape; print(shape._kernel.version()); from shape.kernel import kernel_name; assert kernel_name() == \"rust\""'
          done
  test-macos-intel:
    # the x86_64 macOS wheel is cross-compiled, so install it on a real Intel runner
    needs: wheel
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix: {python: ['3.11', '3.14']}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: wheel-macos-x86_64, path: dist}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', allow-prereleases: true}
      - run: |
          python -m pip install -U pip
          python -m pip install dist/*.whl
          SHAPE_KERNEL=rust python -c "import shape; print(shape._kernel.version()); from shape.kernel import kernel_name; assert kernel_name() == 'rust'"
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with: {command: sdist, args: --out dist}
      - uses: actions/upload-artifact@v4
        with: {name: sdist, path: dist/*.tar.gz}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # the sdist must build with Rust >= 1.85 (the runner's stable) and then run
      - run: |
          python -m pip install -U pip
          python -m pip install dist/*.tar.gz
          SHAPE_KERNEL=rust python -c "import shape; print(shape._kernel.version())"
