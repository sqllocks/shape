name: Fabric live
# The Fabric live tests (plugins/shape-fabric/tests, marker `live`) against the shape-test
# workspace, as the service principal shape-ci-fabric. Nightly, and on demand against any ref.
# Nothing is skipped by this workflow: a test that lacks a value fails (or skips) by name, and the
# step summary lists every live test with its outcome and reason.
on:
  schedule: [{cron: '17 7 * * *'}]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test (default - the ref that triggered the run)
        required: false
        default: ''
        type: string
      transcripts:
        description: Run the documentation Fabric examples (docs-fabric-transcripts job) instead of the live tests
        required: false
        default: false
        type: boolean
      examples:
        description: With transcripts - comma-separated example ids (default - all of tests/docs/fabric_examples.json)
        required: false
        default: ''
        type: string
      set_git_credentials:
        description: Set the CI principal's own Git credentials on the Git workspace to the shared GitHub connection (idempotent one-time setup; default - do nothing)
        required: false
        default: false
        type: boolean
      delete_leftover_notebooks:
        description: List, then delete, only the Notebook items named shape_live_nb_<8 hex> in shape-test (the deploy-notebook test's leftovers; default - do nothing)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  # One run at a time: two runs must never write the same workspace together.
  group: fabric-live
  cancel-in-progress: false
jobs:
  fabric-live:
    if: ${{ !inputs.transcripts }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: fabric-live
    env:
      # Environment variables and secrets, under the names the environment holds them.
      FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ vars.FABRIC_LAKEHOUSE_ID }}
      FABRIC_SQL_ENDPOINT: ${{ vars.FABRIC_SQL_ENDPOINT }}
      # onelake://<workspace>/<lakehouse>/Tables of a classic and of a schema-enabled Lakehouse.
      FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH: ${{ vars.FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH }}
      FABRIC_SCHEMA_LAKEHOUSE_TABLES_PATH: ${{ vars.FABRIC_SCHEMA_LAKEHOUSE_TABLES_PATH }}
      FABRIC_WAREHOUSE: ${{ vars.FABRIC_WAREHOUSE }}
      FABRIC_EVENTHOUSE_URI: ${{ vars.FABRIC_EVENTHOUSE_URI }}
      FABRIC_KQL_DB: ${{ vars.FABRIC_KQL_DB }}
      FABRIC_EVENTSTREAM_CONNECTION_STRING: ${{ secrets.FABRIC_EVENTSTREAM_CONNECTION_STRING }}
      # The Fabric SQL database item (shape_sqldb). No login in it: the service principal's token is passed.
      FABRIC_SQL_CONNECTION_STRING: ${{ secrets.FABRIC_SQL_CONNECTION_STRING }}
      # The sample Warehouse (shape_wh_sample) and the semantic model (shape_sm) the profile tests read.
      FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING: ${{ vars.FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING }}
      FABRIC_SEMANTIC_MODEL: ${{ vars.FABRIC_SEMANTIC_MODEL }}
      # The Git-connected workspace (shape-git-test), its remote and the token that writes to it.
      FABRIC_GIT_WORKSPACE_ID: ${{ vars.FABRIC_GIT_WORKSPACE_ID }}
      FABRIC_GIT_REMOTE: ${{ vars.FABRIC_GIT_REMOTE }}
      FABRIC_GIT_TOKEN: ${{ secrets.FABRIC_GIT_TOKEN }}
      # DefaultAzureCredential signs in as the same service principal.
      AZURE_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      SHAPE_RECORD_DIR: ${{ github.workspace }}/live-tapes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Microsoft ODBC Driver 18 for SQL Server and unixODBC
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install Shape and the plugins from this checkout
        run: >-
          pip install -e '.[dev,azure]'
          -e 'plugins/shape-fabric[sqlserver,eventhubs,entra,semantic-link]'
          -e plugins/shape-eventhubs -e plugins/shape-sqlserver -e plugins/shape-domains
      - name: Derive the values the tests read (no secret is printed)
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          env = os.environ
          out = {}
          notes = []

          def have(*names):
              return all(env.get(n) for n in names)

          # Lakehouse Files folder, the onelake:// form the tests document.
          if have("FABRIC_WORKSPACE_ID", "FABRIC_LAKEHOUSE_ID"):
              out["FABRIC_STAGING_PATH"] = (
                  f"onelake://{env['FABRIC_WORKSPACE_ID']}/{env['FABRIC_LAKEHOUSE_ID']}"
                  "/Files/shape_staging"
              )
          else:
              notes.append("FABRIC_STAGING_PATH not derived: needs FABRIC_WORKSPACE_ID and FABRIC_LAKEHOUSE_ID")

          # Warehouse connection string (no login in it: the principal signs in with a token).
          if have("FABRIC_SQL_ENDPOINT", "FABRIC_WAREHOUSE"):
              out["FABRIC_WAREHOUSE_CONNECTION_STRING"] = (
                  f"Data Source={env['FABRIC_SQL_ENDPOINT']};Initial Catalog={env['FABRIC_WAREHOUSE']}"
              )
          else:
              notes.append("FABRIC_WAREHOUSE_CONNECTION_STRING not derived: needs FABRIC_SQL_ENDPOINT and FABRIC_WAREHOUSE")

          # Eventhouse: eventhouse://<query-uri host>/<database>, and a bearer token for it.
          uri = env.get("FABRIC_EVENTHOUSE_URI", "")
          db = env.get("FABRIC_KQL_DB", "")
          if uri:
              parts = urlsplit(uri if "://" in uri else "https://" + uri)
              host = parts.netloc
              database = parts.path.strip("/").split("/")[0] or db
              if host and database:
                  out["FABRIC_EVENTHOUSE_URI"] = f"eventhouse://{host}/{database}"
                  if have("FABRIC_TENANT_ID", "FABRIC_CLIENT_ID", "FABRIC_CLIENT_SECRET"):
                      from azure.identity import ClientSecretCredential

                      cred = ClientSecretCredential(
                          env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"]
                      )
                      token = cred.get_token(f"https://{host}/.default").token
                      print(f"::add-mask::{token}")
                      out["FABRIC_EVENTHOUSE_TOKEN"] = token
                  else:
                      notes.append("FABRIC_EVENTHOUSE_TOKEN not derived: needs the service principal values")
              else:
                  notes.append("FABRIC_EVENTHOUSE_URI not normalised: needs a host and FABRIC_KQL_DB")
          else:
              notes.append("FABRIC_EVENTHOUSE_URI is not set")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in out.items():
                  assert "\n" not in value
                  f.write(f"{key}={value}\n")
          for key in out:
              print(f"derived {key}")
          for note in notes:
              print(f"::warning::{note}")
          sys.stdout.flush()
          PY
      - name: Set the CI principal's Git credentials (opt-in setup, idempotent)
        # Owner-approved (2026-10-12): link the principal's own Git credentials to the existing
        # shared connection shape-fabric-sync-gh. Fabric's Git APIs use the calling principal's own
        # credentials; it sees the connection but has none set (myGitCredentials source None), so
        # git/status answers GitCredentialsNotConfigured. Does nothing when already set. Prints only
        # the source and connection id, never a token; creates nothing new.
        if: inputs.set_git_credentials
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from azure.identity import ClientSecretCredential

          env = os.environ
          ws = env["FABRIC_GIT_WORKSPACE_ID"]
          name = env.get("FABRIC_GIT_CONNECTION_NAME", "shape-fabric-sync-gh")
          cred = ClientSecretCredential(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"])
          token = cred.get_token("https://api.fabric.microsoft.com/.default").token
          base = "https://api.fabric.microsoft.com/v1"

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()[:1500]

          def show(label, code, doc):
              if isinstance(doc, dict):
                  print(label, code, "source=" + str(doc.get("source")), "connectionId=" + str(doc.get("connectionId")))
              else:
                  print(label, code, doc)

          code, conns = call("GET", f"{base}/connections")
          assert code == 200, (code, conns)
          ids = [c["id"] for c in conns.get("value", []) if c.get("displayName") == name]
          assert len(ids) == 1, f"expected one connection named {name}, found {len(ids)}"
          code, mine = call("GET", f"{base}/workspaces/{ws}/git/myGitCredentials")
          show("before:", code, mine)
          if code == 200 and mine.get("source") == "ConfiguredConnection" and mine.get("connectionId") == ids[0]:
              print("already set; nothing to do")
          else:
              code, out = call("PATCH", f"{base}/workspaces/{ws}/git/myGitCredentials",
                               {"source": "ConfiguredConnection", "connectionId": ids[0]})
              show("PATCH:", code, out)
              assert code in (200, 204), (code, out)
          code, mine = call("GET", f"{base}/workspaces/{ws}/git/myGitCredentials")
          show("after:", code, mine)
          PY
      - name: Delete the deploy-notebook test's leftover notebooks (opt-in, exact names only)
        # Owner-approved (2026-10-12). Lists every Notebook with its id first, then deletes only
        # items whose name is shape_live_nb_ followed by 8 hex digits (what the deploy-notebook test
        # names its notebook). Nothing else is touched; shape_spark_worker stays.
        if: inputs.delete_leftover_notebooks
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from azure.identity import ClientSecretCredential

          env = os.environ
          cred = ClientSecretCredential(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"])
          token = cred.get_token("https://api.fabric.microsoft.com/.default").token
          base = f"https://api.fabric.microsoft.com/v1/workspaces/{env['FABRIC_WORKSPACE_ID']}/items"

          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}

          items, url = [], f"{base}?type=Notebook"
          while url:
              doc = call("GET", url)
              items += doc.get("value", [])
              more = doc.get("continuationToken")
              url = f"{base}?type=Notebook&continuationToken={more}" if more else None
          pattern = re.compile(r"shape_live_nb_[0-9a-f]{8}")
          print("Notebook items in the workspace (the Items API gives no creation time):")
          for item in items:
              print(f"  {item['id']}  {item['displayName']}")
          doomed = [i for i in items if pattern.fullmatch(i["displayName"])]
          print(f"deleting {len(doomed)} item(s) named shape_live_nb_<8 hex>")
          for item in doomed:
              call("DELETE", f"{base}/{item['id']}")
              print(f"  deleted {item['id']}  {item['displayName']}")
          PY
      - name: Live tests
        # Bounded below the job limit so the summary and upload steps always run. Every test name is
        # printed as it starts (-v, unbuffered), and a test that sits for 10 minutes dumps the
        # stack of every thread (faulthandler_timeout) so a hang names the call it is stuck in.
        timeout-minutes: 50
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p "$SHAPE_RECORD_DIR"
          set +e
          python -u -m pytest -m live plugins/shape-fabric/tests -v -rs --durations=0 \
            -o faulthandler_timeout=600 --junitxml=live-junit.xml
          echo "pytest_exit=$?" >> "$GITHUB_ENV"
          exit 0
      - name: List what the live tests left in the workspace (read-only)
        # Lists every item in shape-test (type, name, id) so a stray item can be traced to the test
        # that made it. It deletes nothing.
        if: always()
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from azure.identity import ClientSecretCredential

          env = os.environ
          cred = ClientSecretCredential(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"])
          token = cred.get_token("https://api.fabric.microsoft.com/.default").token
          base = f"https://api.fabric.microsoft.com/v1/workspaces/{env['FABRIC_WORKSPACE_ID']}/items"

          items, url = [], base
          while url:
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  doc = json.loads(resp.read())
              items += doc.get("value", [])
              more = doc.get("continuationToken")
              url = f"{base}?continuationToken={more}" if more else None
          lines = ["## Workspace items after the live tests", ""]
          for item in sorted(items, key=lambda i: (i["type"], i["displayName"])):
              lines.append(f"- {item['type']} `{item['displayName']}` {item['id']}")
          text = "\n".join(lines)
          print(text)
          open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(text + "\n")
          PY
      - name: Git integration status of the Git workspace (read-only GETs, exact responses)
        # What Fabric answers to the CI service principal for the Git-connected workspace. Read-only GET
        # requests, nothing is connected or initialised.
        if: always()
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from azure.identity import ClientSecretCredential

          env = os.environ
          ws = env.get("FABRIC_GIT_WORKSPACE_ID", "")
          if not ws:
              print("FABRIC_GIT_WORKSPACE_ID is not set")
              raise SystemExit(0)
          cred = ClientSecretCredential(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"])
          token = cred.get_token("https://api.fabric.microsoft.com/.default").token
          out = ["## Git integration of the Git workspace", ""]
          # The connections this principal can use (Microsoft: a principal other than the one that
          # connected the workspace needs access to the cloud connection and its own Git credentials).
          conn_req = urllib.request.Request(
              "https://api.fabric.microsoft.com/v1/connections", headers={"Authorization": f"Bearer {token}"}
          )
          try:
              with urllib.request.urlopen(conn_req, timeout=60) as resp:
                  items = json.loads(resp.read()).get("value", [])
              rows = [
                  {k: c.get(k) for k in ("id", "displayName", "connectivityType", "connectionDetails")}
                  for c in items
                  if "git" in json.dumps(c).lower()
              ]
              out += ["### GET /v1/connections (Git-related, as the CI principal)", "```json", json.dumps(rows)[:3000], "```"]
          except urllib.error.HTTPError as exc:
              out += [f"### GET /v1/connections -> HTTP {exc.code}", "```json", exc.read().decode()[:1500], "```"]
          for path in ("git/connection", "git/status", "git/myGitCredentials"):
              url = f"https://api.fabric.microsoft.com/v1/workspaces/{ws}/{path}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      code, body = resp.status, resp.read().decode()
              except urllib.error.HTTPError as exc:
                  code, body = exc.code, exc.read().decode()
              out += [f"### GET /v1/workspaces/{ws}/{path} -> HTTP {code}", "```json", body[:4000], "```"]
          text = "\n".join(out)
          print(text)
          open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(text + "\n")
          PY
      - name: Step summary - which live tests ran, passed, failed, skipped
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "live-junit.xml"
          lines = ["## Fabric live tests", ""]
          if not os.path.exists(path):
              lines.append("pytest produced no result file (it did not start; see the log).")
          else:
              rows = {"passed": [], "failed": [], "skipped": []}
              for case in ET.parse(path).getroot().iter("testcase"):
                  name = f"{case.get('classname', '').split('.')[-1]}::{case.get('name')}"
                  bad = case.find("failure") if case.find("failure") is not None else case.find("error")
                  skip = case.find("skipped")
                  if bad is not None:
                      rows["failed"].append((name, (bad.get("message") or "").splitlines()[:1]))
                  elif skip is not None:
                      rows["skipped"].append((name, [skip.get("message") or ""]))
                  else:
                      rows["passed"].append((name, []))
              lines.append(
                  f"passed {len(rows['passed'])} / failed {len(rows['failed'])} / skipped {len(rows['skipped'])}"
              )
              for kind in ("failed", "skipped", "passed"):
                  if rows[kind]:
                      lines += ["", f"### {kind}", ""]
                      for name, why in rows[kind]:
                          reason = f" - {why[0][:300]}" if why and why[0] else ""
                          lines.append(f"- `{name}`{reason}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
      - name: Upload the scrubbed tapes and the result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-live-results
          path: |
            live-tapes
            live-junit.xml
          if-no-files-found: ignore
      - name: Fail the run when a live test failed
        if: always()
        run: |
          code="${pytest_exit:-missing}"
          echo "pytest exit code: $code"
          [ "$code" = "0" ]
  docs-fabric-transcripts:
    # Transcripts mode of this workflow (dispatch with transcripts=true): runs the documentation
    # examples instead of the live tests, in the same concurrency group and environment.
    if: ${{ inputs.transcripts && github.ref == 'refs/heads/docs/fabric-transcripts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: fabric-live
    permissions:
      contents: write
    env:
      SHAPE_DOCS_RUNNER: ubuntu-latest
      EXAMPLES: ${{ inputs.examples }}
      # The environment's variables and secrets, under the names fabric-live.yml uses.
      FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
      FABRIC_LAKEHOUSE_ID: ${{ vars.FABRIC_LAKEHOUSE_ID }}
      FABRIC_SQL_ENDPOINT: ${{ vars.FABRIC_SQL_ENDPOINT }}
      FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH: ${{ vars.FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH }}
      FABRIC_SCHEMA_LAKEHOUSE_TABLES_PATH: ${{ vars.FABRIC_SCHEMA_LAKEHOUSE_TABLES_PATH }}
      FABRIC_WAREHOUSE: ${{ vars.FABRIC_WAREHOUSE }}
      FABRIC_EVENTHOUSE_URI: ${{ vars.FABRIC_EVENTHOUSE_URI }}
      FABRIC_KQL_DB: ${{ vars.FABRIC_KQL_DB }}
      FABRIC_SQL_CONNECTION_STRING: ${{ secrets.FABRIC_SQL_CONNECTION_STRING }}
      FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING: ${{ vars.FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING }}
      FABRIC_SEMANTIC_MODEL: ${{ vars.FABRIC_SEMANTIC_MODEL }}
      FABRIC_GIT_WORKSPACE_ID: ${{ vars.FABRIC_GIT_WORKSPACE_ID }}
      FABRIC_GIT_REMOTE: ${{ vars.FABRIC_GIT_REMOTE }}
      FABRIC_GIT_TOKEN: ${{ secrets.FABRIC_GIT_TOKEN }}
      AZURE_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      SHAPE_TEST_SYNAPSE_URI: ${{ vars.SHAPE_TEST_SYNAPSE_URI }}
      SHAPE_TEST_SYNAPSE_STAGING: ${{ vars.SHAPE_TEST_SYNAPSE_STAGING }}
      SYNAPSE_SUBSCRIPTION_ID: ${{ vars.SYNAPSE_SUBSCRIPTION_ID }}
      SYNAPSE_RESOURCE_GROUP: ${{ vars.SYNAPSE_RESOURCE_GROUP }}
      SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE }}
      SYNAPSE_POOL: ${{ vars.SYNAPSE_POOL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Mask the secrets and the identifiers the pages show as placeholders
        run: |
          for v in FABRIC_CLIENT_SECRET FABRIC_SQL_CONNECTION_STRING FABRIC_GIT_TOKEN FABRIC_TENANT_ID \
                   FABRIC_CLIENT_ID FABRIC_WORKSPACE_ID FABRIC_LAKEHOUSE_ID FABRIC_GIT_WORKSPACE_ID; do
            [ -z "${!v}" ] || echo "::add-mask::${!v}"
          done
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Microsoft ODBC Driver 18 for SQL Server and unixODBC
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install Shape and the plugins from this checkout
        run: >-
          pip install -q -e '.[dev,azure]'
          -e 'plugins/shape-fabric[sqlserver,eventhubs,entra,semantic-link]'
          -e plugins/shape-eventhubs -e plugins/shape-sqlserver -e plugins/shape-domains
          -e plugins/shape-databases pyyaml
      - name: Validate the capture harness
        run: python -m pytest -q tests/docs/test_fabric_transcripts.py
      - name: Sign in the Azure CLI as the service principal (the default --auth cli)
        run: |
          az login --service-principal --username "$FABRIC_CLIENT_ID" --password "$FABRIC_CLIENT_SECRET" \
            --tenant "$FABRIC_TENANT_ID" --output none
      - name: Derive the values the examples substitute (no secret is printed)
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          env = os.environ
          out, notes = {}, []

          def need(*names):
              return all(env.get(n) for n in names)

          # The classic Lakehouse: onelake://<workspace>/<lakehouse>/Tables
          path = env.get("FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH", "")
          m = re.fullmatch(r"onelake://([^/]+)/([^/]+)/Tables/?", path)
          if m:
              out["DOCS_WS"], out["DOCS_LH"] = m.group(1), m.group(2)
          else:
              notes.append("DOCS_WS/DOCS_LH not derived: FABRIC_CLASSIC_LAKEHOUSE_TABLES_PATH is not onelake://W/L/Tables")
          if need("FABRIC_SQL_ENDPOINT", "FABRIC_WAREHOUSE"):
              out["DOCS_WAREHOUSE_CONNECTION"] = (
                  f"Data Source={env['FABRIC_SQL_ENDPOINT']};Initial Catalog={env['FABRIC_WAREHOUSE']}"
              )
          # The sample Warehouse: server and database for `shape profile-db`.
          sample = env.get("FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING", "")
          parts = dict(
              (k.strip().lower(), v.strip())
              for k, _, v in (p.partition("=") for p in sample.split(";") if "=" in p)
          )
          server = parts.get("data source") or parts.get("server")
          database = parts.get("initial catalog") or parts.get("database")
          if server and database:
              out["DOCS_SAMPLE_SERVER"] = server.removeprefix("tcp:").split(",")[0]
              out["DOCS_SAMPLE_DB"] = database
          else:
              notes.append("DOCS_SAMPLE_SERVER/DB not derived from FABRIC_SAMPLE_WAREHOUSE_CONNECTION_STRING")
          # Eventhouse query URI host.
          uri = env.get("FABRIC_EVENTHOUSE_URI", "")
          if uri:
              out["DOCS_KQL_HOST"] = urlsplit(uri if "://" in uri else "https://" + uri).netloc
          # A Fabric API token for the fabric_spark example (the page exports SHAPE_FABRIC_TOKEN).
          if need("FABRIC_TENANT_ID", "FABRIC_CLIENT_ID", "FABRIC_CLIENT_SECRET"):
              from azure.identity import ClientSecretCredential

              cred = ClientSecretCredential(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], env["FABRIC_CLIENT_SECRET"])
              token = cred.get_token("https://api.fabric.microsoft.com/.default").token
              print(f"::add-mask::{token}")
              out["DOCS_FABRIC_API_TOKEN"] = token
          # The first table of the semantic model (the page names a table of its own model).
          if need("FABRIC_WORKSPACE_ID", "FABRIC_SEMANTIC_MODEL"):
              try:
                  from shape_fabric import semantic_source as ss

                  from sempy.fabric import set_service_principal

                  # Only to learn a table name; the example itself runs without this sign-in.
                  with set_service_principal(env["FABRIC_TENANT_ID"], env["FABRIC_CLIENT_ID"], client_secret=env["FABRIC_CLIENT_SECRET"]):
                      out["DOCS_SEM_TABLE"] = ss.table_names(env["FABRIC_WORKSPACE_ID"], env["FABRIC_SEMANTIC_MODEL"])[0]
              except Exception as exc:  # the example then fails naming the missing value
                  notes.append(f"DOCS_SEM_TABLE not derived: {type(exc).__name__}")
          for value in out.values():
              print(f"::add-mask::{value}")
          with open(env["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for key, value in out.items():
                  assert "\n" not in value
                  f.write(f"{key}={value}\n")
          for key in out:
              print(f"derived {key}")
          for note in notes:
              print(f"::warning::{note}")
          sys.stdout.flush()
          PY
      - name: Resume the Synapse dedicated SQL pool
        if: env.EXAMPLES == '' || contains(env.EXAMPLES, 'synapse-write')
        timeout-minutes: 20
        run: |
          missing=""
          for v in SYNAPSE_SUBSCRIPTION_ID SYNAPSE_RESOURCE_GROUP SYNAPSE_WORKSPACE SYNAPSE_POOL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::cannot resume the Synapse pool, missing:$missing; synapse-write will record that"
            exit 0
          fi
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true >/dev/null
          az account set --subscription "$SYNAPSE_SUBSCRIPTION_ID"
          pool=(--name "$SYNAPSE_POOL" --workspace-name "$SYNAPSE_WORKSPACE" --resource-group "$SYNAPSE_RESOURCE_GROUP")
          deadline=$((SECONDS + 15 * 60))
          while true; do
            status=$(az synapse sql pool show "${pool[@]}" --query status --output tsv)
            echo "$(date -u +%H:%M:%S) pool status: $status"
            case "$status" in
              Online) break ;;
              Paused) az synapse sql pool resume "${pool[@]}" ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the pool was not Online within 15 minutes (last status: $status)"
              exit 1
            fi
            sleep 20
          done
      - name: Run the page commands and capture real receipts
        timeout-minutes: 130
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          if python scripts/docs_fabric_transcripts.py --only "$EXAMPLES"; then
            echo 'CAPTURE_EXIT=0' >> "$GITHUB_ENV"
          else
            echo 'CAPTURE_EXIT=1' >> "$GITHUB_ENV"
          fi
      - name: Upload successful and failed receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-fabric-transcripts-${{ github.run_id }}-${{ github.sha }}
          path: docs/plans/evidence/owner-notes/docs-transcripts-${{ github.run_id }}-*
          if-no-files-found: warn
      - name: Pause the Synapse dedicated SQL pool (also after a failure or a cancel)
        if: always() && (env.EXAMPLES == '' || contains(env.EXAMPLES, 'synapse-write'))
        timeout-minutes: 20
        run: |
          if [ -z "$SYNAPSE_POOL" ] || [ -z "$SYNAPSE_WORKSPACE" ] || [ -z "$SYNAPSE_RESOURCE_GROUP" ] \
             || [ -z "$SYNAPSE_SUBSCRIPTION_ID" ]; then
            echo "Synapse pool variables are not set; nothing was resumed"
            exit 0
          fi
          az login --service-principal --username "$FABRIC_CLIENT_ID" --password "$FABRIC_CLIENT_SECRET" \
            --tenant "$FABRIC_TENANT_ID" --output none
          az account set --subscription "$SYNAPSE_SUBSCRIPTION_ID"
          pool=(--name "$SYNAPSE_POOL" --workspace-name "$SYNAPSE_WORKSPACE" --resource-group "$SYNAPSE_RESOURCE_GROUP")
          status=$(az synapse sql pool show "${pool[@]}" --query status --output tsv)
          echo "pool status: $status"
          [ "$status" != "Online" ] || az synapse sql pool pause "${pool[@]}"
      - name: Commit receipts and only the successfully resolved notes to this branch
        if: always() && env.CAPTURE_EXIT != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plans/evidence/owner-notes/docs-transcripts-${GITHUB_RUN_ID}-* docs/evidence/transcripts \
            docs/FABRIC_PLATFORM.md docs/SCALE.md docs/SINKS.md docs/plugins/cloud-sources.md \
            docs/plugins/fabric-commands.md docs/plugins/fabric-writers.md docs/plugins/sqlserver.md
          if ! git diff --cached --quiet; then
            git switch -c "docs-fabric-transcripts-evidence-${GITHUB_RUN_ID}"
            git commit -s -m "docs-fabric-transcripts: record run $GITHUB_RUN_ID [skip ci]"
            git switch -C docs/fabric-transcripts "$GITHUB_SHA"
            git merge --no-ff --signoff -m "docs-fabric-transcripts: merge run $GITHUB_RUN_ID receipts [skip ci]" "docs-fabric-transcripts-evidence-${GITHUB_RUN_ID}"
            git fetch origin docs/fabric-transcripts
            git merge --no-ff --signoff --no-edit origin/docs/fabric-transcripts
            git push origin HEAD:docs/fabric-transcripts
          fi
      - name: Fail the job if any example failed
        if: always()
        run: test "${CAPTURE_EXIT:-1}" = 0
