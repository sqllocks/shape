name: Pacing diagnostic
# CI-FIX item 5: evidence for the macOS realtime pacing tests. It runs when this file or the
# script changes on lane/CI-FIX (or by hand) and asserts nothing: it prints what the runner does.
on:
  push:
    branches: [lane/CI-FIX]
    paths: [.github/workflows/pacing-diagnostic.yml, scripts/pacing_diagnostic.py]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]' -e plugins/shape-domains
      - run: python scripts/pacing_diagnostic.py
