name: Container
# PF-05: the Shape CLI image. Every PR that touches it builds the image and checks it; a version
# tag publishes it to GHCR. Nothing is published from a branch or a pull request.
on:
  push:
    tags: ['v*']
    paths: ['Dockerfile', '.dockerignore', '.github/workflows/container.yml', 'rust/**', 'src/**', 'pyproject.toml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', '.github/workflows/container.yml', 'rust/**', 'src/**', 'pyproject.toml']
  workflow_dispatch: {}
permissions: {contents: read}
env: {IMAGE: ghcr.io/sqllocks/shape}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., load: true, tags: 'shape:ci', cache-from: 'type=gha', cache-to: 'type=gha,mode=max'}
      - name: Image size is under 500 MB
        run: |
          size=$(docker image inspect shape:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          test "$size" -lt 500000000
      - name: Runs as a non-root user with the [azure] packages and the Rust kernel
        run: |
          test "$(docker run --rm shape:ci id -u)" != 0
          docker run --rm -e SHAPE_KERNEL=rust shape:ci python -c \
            "import adlfs, azure.identity, deltalake, shape; from shape.kernel import kernel_name; assert kernel_name() == 'rust'"
          docker run --rm shape:ci shape plugins list --group shape.sources
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Profile D1, mounted read-only from the host, inside the image
        run: |
          pip install numpy pyarrow
          export BENCH_DATA_DIR="$RUNNER_TEMP/bench-data"
          python benchmarks/vs_spindle/profile_1to1/datasets.py D1
          mkdir -p "$RUNNER_TEMP/out" && chmod 777 "$RUNNER_TEMP/out"
          for f in d1.parquet d1.csv; do
            docker run --rm -v "$BENCH_DATA_DIR/profile:/data:ro" -v "$RUNNER_TEMP/out:/work" \
              shape:ci shape profile "/data/$f" -o "/work/${f%.*}.shape" --json "/work/${f%.*}.json"
            test -s "$RUNNER_TEMP/out/${f%.*}.shape"
          done
  publish:
    # Only for a version tag; the owner creates tags (plan section 9).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}'}
      - uses: actions/attest-build-provenance@v2
        with: {subject-name: '${{ env.IMAGE }}', subject-digest: '${{ steps.push.outputs.digest }}', push-to-registry: true}
