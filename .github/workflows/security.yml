name: Security
on:
  # Full CI runs on the integration branches; lane branches are verified locally by the lead
  # before they merge (the queue reached 179 runs when every lane push ran the full matrix).
  push:
    branches: [main, build/main-plan, lane/CI-FIX]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      # shape-fabric: tests/scale/test_kql_sink_uri.py (AUD-security2 #295) checks the kql sink's
      # URI with the plugin's own parser.
      - run: python -m pip install -e ".[dev,streaming]" -e plugins/shape-fabric
      - run: pip-audit --skip-editable
      - run: bandit -q -r src -ll
      - run: python scripts/check_secrets.py
      # The Fabric demo tests need extra packages and run in ci.yml's fabric-demo job.
      - run: pytest -m security --ignore=tests/demo/fabric
