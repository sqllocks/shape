name: Security
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,streaming]"
      - run: pip-audit --skip-editable
      - run: bandit -q -r src -ll
      - run: python scripts/check_secrets.py
      # The Fabric demo tests need extra packages and run in ci.yml's fabric-demo job.
      - run: pytest -m security --ignore=tests/demo/fabric
