name: Documentation
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      # The runner context is not available in workflow-level env, so the path is set here.
      - run: echo "SHAPE_DOCS_DBT_PACKAGES=$RUNNER_TEMP/docs-dbt-packages" >> "$GITHUB_ENV"
      - run: uv sync --locked --group docs
      - run: uv run --locked --no-sync python scripts/check_docs_requirements.py
      - run: uv run --locked --no-sync python scripts/docs_dbt_packages.py --directory "$SHAPE_DOCS_DBT_PACKAGES"
      - name: Block release documentation with unresolved owner notes
        if: github.ref_type == 'tag'
        run: uv run --locked --no-sync python scripts/check_docs_owners.py --release
      - run: uv run --locked --no-sync pytest -q -n 3 -o tmp_path_retention_policy=failed tests/docs/test_launch_tutorials.py tests/docs/test_launch_api.py tests/docs/test_launch_site.py tests/docs/test_reference_examples.py tests/docs/test_owner_notes.py tests/docs/test_brand.py tests/docs/test_transcripts.py
      - run: uv run --locked --no-sync mkdocs build --strict
      - run: uv run --locked --no-sync python scripts/check_doc_links.py --site site
      - run: uv run --locked --no-sync python scripts/check_user_facing.py --site site
      - run: uv run --locked --no-sync python scripts/check_docs_language.py --site site
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: documentation-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-docs.txt
      - run: pip install --no-deps -e . $(for plugin in plugins/*/pyproject.toml; do printf ' -e %s' "${plugin%/pyproject.toml}"; done)
      - name: Block tag publishing with unresolved owner notes
        if: github.ref_type == 'tag'
        run: python scripts/check_docs_owners.py --release
      - name: Publish versioned documentation
        env:
          DOCS_REF_TYPE: ${{ github.ref_type }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if [ "$DOCS_REF_TYPE" = tag ]; then
            mike deploy --push --update-aliases "$DOCS_REF_NAME" latest
            mike set-default --push latest
          else
            mike deploy --push dev
          fi
          git worktree add /tmp/docs-pages gh-pages
          cp docs/CNAME /tmp/docs-pages/CNAME
          cd /tmp/docs-pages
          git add CNAME
          if ! git diff --cached --quiet; then
            git commit -m "docs: set custom domain"
            git push origin HEAD:gh-pages
          fi
