name: Documentation
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-docs.txt
      - run: pip install --no-deps -e . -e plugins/shape-domains -e plugins/shape-databases -e plugins/shape-integrations
      - run: pytest -q tests/docs/test_launch_tutorials.py tests/docs/test_launch_api.py tests/docs/test_launch_site.py
      - run: mkdocs build --strict
      - run: python scripts/check_doc_links.py --site site
      - run: python scripts/check_user_facing.py --site site
      - run: python scripts/check_docs_language.py --site site
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site
  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: documentation-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-docs.txt
      - run: pip install --no-deps -e . -e plugins/shape-domains -e plugins/shape-databases -e plugins/shape-integrations
      - name: Publish versioned documentation
        env:
          DOCS_REF_TYPE: ${{ github.ref_type }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if [ "$DOCS_REF_TYPE" = tag ]; then
            mike deploy --push --update-aliases "$DOCS_REF_NAME" latest
            mike set-default --push latest
          else
            mike deploy --push dev
          fi
          git worktree add /tmp/docs-pages gh-pages
          cp docs/CNAME /tmp/docs-pages/CNAME
          cd /tmp/docs-pages
          git add CNAME
          if ! git diff --cached --quiet; then
            git commit -m "docs: set custom domain"
            git push origin HEAD:gh-pages
          fi
