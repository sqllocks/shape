name: Scratch macOS keyed-state memory probe
on:
  push:
    branches: [scratch/macos-rss-control]
    paths:
      - scripts/scratch/macos_keyed_controls.py
      - tests/streaming/test_keyed_state.py
      - .github/workflows/scratch-macos-keyed.yml
permissions: {contents: read}
jobs:
  keyed:
    runs-on: macos-latest
    timeout-minutes: 120
    env: {PYTHONPATH: ci}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', allow-prereleases: true}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev,streaming,advanced,docs]'
      - name: Keyed-state gate on live heap, with both growth controls
        run: python scripts/scratch/macos_keyed_controls.py "$RUNNER_TEMP/keyed-controls"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-keyed-probe
          path: ${{ runner.temp }}/keyed-controls/
