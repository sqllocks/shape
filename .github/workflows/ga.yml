name: GA qualification
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/check_requirements.py
      - run: python scripts/check_secrets.py
      - run: python -m compileall -q src/shape
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/shape-clean
      - run: /tmp/shape-clean/bin/pip install dist/*.whl
      - run: /tmp/shape-clean/bin/shape doctor
      - uses: actions/upload-artifact@v4
        with: {name: ga-distributions, path: dist/*}
  pyarrow:
    strategy: {matrix: {python: ['3.11','3.12','3.13']}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}'}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/kernel tests/types
