name: External connector qualification
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  simulated-resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev]'
      - run: python rq/connector_resilience_suite.py
      - run: python rq/connector_suite.py
  kafka:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ['9092:9092']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev,kafka]'
      - env: {SHAPE_LIVE_KAFKA: '1', KAFKA_BOOTSTRAP_SERVERS: 'localhost:9092'}
        run: python rq/live_kafka_qualification.py
  eventhubs:
    runs-on: ubuntu-latest
    env:
      AZURE_EVENTHUB_CONNECTION_STRING: ${{ secrets.AZURE_EVENTHUB_CONNECTION_STRING }}
      AZURE_EVENTHUB_NAME: ${{ secrets.AZURE_EVENTHUB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev,eventhubs]'
      - if: ${{ env.AZURE_EVENTHUB_CONNECTION_STRING != '' && env.AZURE_EVENTHUB_NAME != '' }}
        env:
          SHAPE_LIVE_EVENTHUBS: '1'
          AZURE_EVENTHUB_CONNECTION_STRING: ${{ secrets.AZURE_EVENTHUB_CONNECTION_STRING }}
          AZURE_EVENTHUB_NAME: ${{ secrets.AZURE_EVENTHUB_NAME }}
        run: python rq/live_eventhubs_qualification.py
