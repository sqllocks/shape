name: Docs problem
description: Report a documentation error.
body:
- type: markdown
  attributes:
    value: Do not include credentials, production rows or private profiles.
- type: input
  id: page-url
  attributes:
    label: Page URL
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is wrong?
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What should it say?
  validations:
    required: true
