name: Feature request
description: Describe a concrete problem and expected behavior.
body:
- type: markdown
  attributes:
    value: Do not include credentials, production rows or private profiles.
- type: textarea
  id: problem
  attributes:
    label: Problem
  validations:
    required: true
- type: textarea
  id: behavior
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: case
  attributes:
    label: Small reproducible example
  validations:
    required: true
