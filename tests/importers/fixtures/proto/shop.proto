syntax = "proto3";

// A small shop, written for the importer tests.
package demo.shop;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/duration.proto";
import "common.proto";

option java_package = "demo.shop";

enum Status {
  STATUS_UNKNOWN = 0;
  PLACED = 1;
  SHIPPED = 2;
}

/* an order */
message Order {
  int64 id = 1;
  string note = 2;
  double total = 3;
  bool express = 4;
  optional string coupon = 5;
  Status status = 6;
  google.protobuf.Timestamp placed_at = 7;
  google.protobuf.StringValue label = 8;
  google.protobuf.Duration eta = 9;
  Customer customer = 10;
  repeated Line lines = 11;
  repeated string tags = 12;
  repeated Status history = 13;
  map<string, int32> counters = 14;
  map<string, Customer> by_name = 15;
  bytes blob = 16;
  Money price = 17;
  oneof contact {
    string email = 18;
    string phone = 19;
  }
  Sub.Inner inner = 20;
  message Line {
    int32 sku = 1;
    int32 qty = 2;
  }
}

message Customer {
  int64 customer_id = 1;
  string name = 2;
  uint32 age = 3;
}

message Sub {
  message Inner {
    string tag = 1;
  }
  int32 n = 1;
}

service Shop {
  rpc Place (Order) returns (Order);
}
