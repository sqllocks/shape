[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"

[tool.importlinter]
root_package = "shape"

[[tool.importlinter.contracts]]
name = "Built-ins load only through the plugin registry (plan 4.3)"
type = "forbidden"
# Every top-level module except shape.builtins (a test fails when one is missing here: naming
# the root "shape" would make import-linter skip its own subpackages).
source_modules = [
    "shape._callable",
    "shape._process",
    "shape.api",
    "shape.artifact",
    "shape.capture",
    "shape.chaos",
    "shape.cli",
    "shape.connectors",
    "shape.contracts",
    "shape.diff",
    "shape.dimensional",
    "shape.drift",
    "shape.errors",
    "shape.fidelity",
    "shape.generation",
    "shape.geospatial",
    "shape.integrations",
    "shape.io",
    "shape.kernel",
    "shape.location",
    "shape.model",
    "shape.runlog",
    "shape.scenario",
    "shape.packs",
    "shape.plugins",
    "shape.privacy",
    "shape.profile",
    "shape.quality",
    "shape.query",
    "shape.registry",
    "shape.relations",
    "shape.report",
    "shape.schemacheck",
    "shape.security",
    "shape.spec",
    "shape.streaming",
    "shape.types",
    "shape.validation",
]
forbidden_modules = ["shape.builtins"]
allow_indirect_imports = true
ignore_imports = [
    "shape.plugins.registry -> shape.builtins.catalog",
]
