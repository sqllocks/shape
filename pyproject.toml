[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[project]
name = "sqllocks-shape"
version = "0.9.0"
description = "Shape by SQLLocks — Shape as Code: profile, check and compare how your data behaves. Early access."
readme="README.md"
requires-python=">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies=["numpy>=1.26,<3","pyarrow>=14.0.1","pydantic>=2.9,<3","typing-extensions>=4.12","cryptography>=50,<51"]

[project.optional-dependencies]
yaml=["pyyaml>=6"]
delta=["deltalake>=0.17"]
pandas=["pandas>=2"]
kafka=["confluent-kafka>=2.5,<4"]
eventhubs=["azure-eventhub>=5.12,<6"]
streaming=["confluent-kafka>=2.5,<4","azure-eventhub>=5.12,<6"]
dev=["pytest>=8.3","pytest-cov>=6","hypothesis>=6.115","ruff>=0.8","mypy>=1.13","pip-audit>=2.7","build>=1.2","pyyaml>=6","pandas>=2","deltalake>=0.17","twine>=5"]

[tool.hatch.build.targets.wheel]
packages=["src/shape"]

[tool.hatch.build.targets.wheel.force-include]
"docs/specs" = "shape/schemas"

[tool.hatch.build.targets.sdist]
include=["/src", "/tests", "/rq", "/docs", "/scripts", "/.github", "/examples", "/benchmarks", "/security", "/.devcontainer", "/*.md", "/*.json", "/LICENSE", "/Makefile", "/CODEOWNERS", "/.gitignore", "/.env.example", "/GA_FINAL_TEST.txt"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-markers --import-mode=importlib"
markers=["conformance: normative conformance","security: security invariant","zero_network: network forbidden","sign: needs the cryptography extra","contract: contract test (no external service)","emulator: needs a Docker emulator (CI nightly only)","live: needs live cloud resources"]

[tool.ruff]
target-version="py311"
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]

[tool.mypy]
python_version="3.11"
strict=true
packages=["shape"]

[project.scripts]
shape = "shape.cli.main:main"

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
