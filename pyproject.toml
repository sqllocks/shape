[build-system]
requires=["maturin>=1.15,<2"]
build-backend="maturin"

[project]
name = "sqllocks-shape"
version = "0.9.0"
description = "Shape by SQLLocks — Shape as Code: profile, check and compare how your data behaves. Early access."
readme="README.md"
requires-python=">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies=["numpy>=2.0,<3","pyarrow>=14.0.1"]

[project.optional-dependencies]
yaml=["pyyaml>=6"]
sign=["cryptography>=50,<51"]
delta=["deltalake>=0.17"]
pandas=["pandas>=2"]
kafka=["confluent-kafka>=2.5,<4"]
eventhubs=["azure-eventhub>=5.12,<6"]
streaming=["confluent-kafka>=2.5,<4","azure-eventhub>=5.12,<6"]
dev=["pytest>=8.3","pytest-cov>=6","hypothesis>=6.115","ruff>=0.8","mypy>=1.13","pip-audit>=2.7","build>=1.2","pyyaml>=6","pandas>=2","deltalake>=0.17","twine>=5","cryptography>=50,<51","xxhash>=3.5","maturin>=1.15,<2","import-linter>=2","vulture>=2.11","bandit>=1.8","py-spy>=0.4","sqlglot>=25"]

[tool.maturin]
# T-05: mixed Python/Rust layout. The kernel is `shape._kernel`, built from rust/shape-kernel.
python-source="src"
module-name="shape._kernel"
manifest-path="rust/shape-kernel/Cargo.toml"
profile="release"
include=[
  {path="tests/**/*", format="sdist"},
  {path="docs/**/*", format="sdist"},
  {path="scripts/**/*", format="sdist"},
  {path="examples/**/*", format="sdist"},
  {path="benchmarks/**/*", format="sdist"},
  {path="security/**/*", format="sdist"},
  {path=".github/**/*", format="sdist"},
  {path="*.md", format="sdist"},
  {path="Makefile", format="sdist"},
  {path="CODEOWNERS", format="sdist"},
]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-markers --import-mode=importlib"
markers=["conformance: normative conformance","security: security invariant","zero_network: network forbidden","sign: needs the cryptography extra","contract: contract test (no external service)","emulator: needs a Docker emulator (CI nightly only)","live: needs live cloud resources","heavy: runs millions of values; CI runs these without coverage tracing"]

[tool.ruff]
target-version="py311"
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]

[tool.mypy]
python_version="3.11"
strict=true
mypy_path="src"
packages=["shape"]

# T-12 ratchet: modules not yet strict. A work package that creates or rewrites a module
# removes it from this list; the list must be empty by G8.
[[tool.mypy.overrides]]
module=[
    "shape.artifact.canonical",
    "shape.artifact.io",
    "shape.artifact.migrate",
    "shape.artifact.secure",
    "shape.artifact.shape_file",
    "shape.cli.main",
    "shape.connectors.dbapi",
    "shape.connectors.eventhubs",
    "shape.connectors.files",
    "shape.connectors.kafka",
    "shape.connectors.qualification",
    "shape.connectors.registry",
    "shape.drift.policy",
    "shape.generation.address_vectorized",
    "shape.generation.advanced",
    "shape.generation.certificate",
    "shape.generation.compiler",
    "shape.generation.core",
    "shape.generation.distribution_fidelity",
    "shape.generation.evolution",
    "shape.generation.fidelity",
    "shape.generation.future",
    "shape.generation.geo_fidelity",
    "shape.generation.joint",
    "shape.generation.relational",
    "shape.generation.relational_fidelity",
    "shape.generation.release",
    "shape.generation.strategies",
    "shape.generation.timeline",
    "shape.generation.vectorized",
    "shape.geospatial.core",
    "shape.location.core",
    "shape.location.reference",
    "shape.packs.address",
    "shape.packs.domains",
    "shape.packs.person",
    "shape.packs.sdk",
    "shape.packs.verify",
    "shape.plugins.core",
    "shape.plugins.runtime",
    "shape.privacy.advanced",
    "shape.privacy.classification",
    "shape.privacy.core",
    "shape.privacy.detect",
    "shape.privacy.propagate",
    "shape.privacy.release",
    "shape.profile.advanced",
    "shape.profile.datetime",
    "shape.profile.dependence",
    "shape.profile.dependencies",
    "shape.profile.reference.column",
    "shape.profile.semantic_future",
    "shape.kernel.reference.pysketch",
    "shape.profile.temporal",
    "shape.quality.core",
    "shape.quality.policy",
    "shape.relations.core",
    "shape.security.crypto",
    "shape.security.hardening",
    "shape.spec.capabilities",
    "shape.spec.io",
    "shape.spec.migrate",
    "shape.spec.model",
    "shape.streaming.aggregate_windows",
    "shape.streaming.checkpoint",
    "shape.streaming.core",
    "shape.streaming.evidence",
    "shape.streaming.failure",
    "shape.streaming.full_engine",
    "shape.streaming.keyed",
    "shape.streaming.monitor",
    "shape.streaming.online",
    "shape.streaming.platinum",
    "shape.streaming.vectorized",
    "shape.streaming.windows",
    "shape.types",
    "shape.validation",
    "shape.validation.adversarial",
    "shape.validation.fuzz",
    "shape.validation.invariants",
    "shape.validation.statistics",
    "shape.validation.suite",
