[project.entry-points."shape.commands"]
ctgan = "shape.builtins.ctgan:CtganCommand"

[project.entry-points."shape.transforms"]
mask = "shape.builtins.transforms:Mask"
star = "shape.builtins.dimensional:StarTransform"
cdm = "shape.builtins.dimensional:CdmTransform"

[project.entry-points."shape.distributions"]
normal = "shape.builtins.distributions:Normal"
uniform = "shape.builtins.distributions:Uniform"
exponential = "shape.builtins.distributions:Exponential"
lognormal = "shape.builtins.distributions:Lognormal"
