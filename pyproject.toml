[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"

[project]
name = "sqllocks-shape"
version = "1.0.0"
description = "Shape by SQLLocks — an open Shape-as-Code specification and high-performance engine for capturing, governing, comparing, testing, and reconstructing how data behaves."
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=["numpy>=1.26,<3","pyarrow>=23.0.1,<24","pydantic>=2.9,<3","typing-extensions>=4.12","cryptography>=50,<51"]

[project.optional-dependencies]
yaml=["pyyaml>=6"]
kafka=["confluent-kafka>=2.5,<4"]
eventhubs=["azure-eventhub>=5.12,<6"]
streaming=["confluent-kafka>=2.5,<4","azure-eventhub>=5.12,<6"]
dev=["pytest>=8.3","pytest-cov>=6","hypothesis>=6.115","ruff>=0.8","mypy>=1.13","pip-audit>=2.7","build>=1.2","pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages=["src/shape"]

[tool.hatch.build.targets.wheel.force-include]
"docs/specs" = "shape/schemas"

[tool.hatch.build.targets.sdist]
include=["/src", "/tests", "/rq", "/docs", "/scripts", "/.github", "/examples", "/benchmarks", "/security", "/.devcontainer", "/*.md", "/*.json", "/LICENSE", "/Makefile", "/CODEOWNERS", "/.gitignore", "/.env.example", "/GA_FINAL_TEST.txt"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-markers --import-mode=importlib"
markers=["conformance: normative conformance","security: security invariant","zero_network: network forbidden"]

[tool.ruff]
target-version="py311"
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]

[tool.mypy]
python_version="3.11"
strict=true
packages=["shape"]

[project.scripts]
shape = "shape.cli.main:main"

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
