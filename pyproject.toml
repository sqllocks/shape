[build-system]
requires=["maturin>=1.15,<2"]
build-backend="maturin"

[project]
name = "sqllocks-shape"
version = "0.9.0"
description = "Shape by SQLLocks — Shape as Code: profile, check and compare how your data behaves. Early access."
readme="README.md"
requires-python=">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies=["numpy>=2.0,<3","pyarrow>=14.0.1"]

[project.optional-dependencies]
yaml=["pyyaml>=6"]
sign=["cryptography>=50,<51"]
delta=["deltalake>=0.17"]
excel=["openpyxl>=3.1"]
azure=["adlfs>=2024.4.1","azure-identity>=1.15","deltalake>=0.17"]
pandas=["pandas>=2"]
scipy=["scipy>=1.11"]
advanced=["scikit-learn>=1.3,<2"]
ctgan=["sdv>=1.0,<2"]
kafka=["sqllocks-shape-kafka==0.9.0"]
eventhubs=["sqllocks-shape-eventhubs==0.9.0"]
sqlserver=["sqllocks-shape-sqlserver==0.9.0"]
domains=["sqllocks-shape-domains==0.9.0"]
streaming=["confluent-kafka>=2.5,<4","azure-eventhub>=5.12,<6"]
dev=["pytest>=8.3","pytest-cov>=6","hypothesis>=6.115","ruff>=0.8","mypy>=1.13","pip-audit>=2.7","build>=1.2","pyyaml>=6","pandas>=2","deltalake>=0.17","twine>=5","cryptography>=50,<51","xxhash>=3.5","maturin>=1.15,<2","import-linter>=2","vulture>=2.11","bandit>=1.8","py-spy>=0.4","sqlglot>=25","openpyxl>=3.1","scipy>=1.11","pyspark>=4.0,<5"]

[tool.maturin]
# T-05: mixed Python/Rust layout. The kernel is `shape._kernel`, built from rust/shape-kernel.
python-source="src"
module-name="shape._kernel"
manifest-path="rust/shape-kernel/Cargo.toml"
profile="release"
include=[
  {path="tests/**/*", format="sdist"},
  {path="docs/**/*", format="sdist"},
  {path="scripts/**/*", format="sdist"},
  {path="examples/**/*", format="sdist"},
  {path="benchmarks/**/*", format="sdist"},
  {path="security/**/*", format="sdist"},
  {path=".github/**/*", format="sdist"},
  {path="*.md", format="sdist"},
  {path="Makefile", format="sdist"},
  {path="CODEOWNERS", format="sdist"},
]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra --strict-markers --import-mode=importlib"
markers=["conformance: normative conformance","security: security invariant","zero_network: network forbidden","sign: needs the cryptography extra","contract: contract test (no external service)","emulator: needs a Docker emulator (CI nightly only)","live: needs live cloud resources","heavy: runs millions of values; CI runs these without coverage tracing"]

[tool.ruff]
target-version="py311"
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP"]

[tool.mypy]
python_version="3.11"
strict=true
mypy_path="src"
packages=["shape"]

# Optional cloud packages (extra [azure], and Fabric's own notebookutils): not installed in every
# environment, so mypy must not depend on them being present.
[[tool.mypy.overrides]]
module=["adlfs","azure.*","deltalake","deltalake.*","openpyxl","openpyxl.*","notebookutils","mssparkutils","pyspark","pyspark.*","sklearn","sklearn.*","scipy","scipy.*","sdv","sdv.*"]
ignore_missing_imports=true

# T-12 ratchet: modules not yet strict. A work package that creates or rewrites a module
# removes it from this list; the list must be empty by G8.
[[tool.mypy.overrides]]
module=[
    "shape.artifact.canonical",
    "shape.artifact.migrate",
    "shape.artifact.secure",
    "shape.cli.main",
    "shape.connectors.dbapi",
    "shape.connectors.eventhubs",
    "shape.connectors.kafka",
    "shape.builtins.strategies.address",
    "shape.drift.policy",
    "shape.generation.address_vectorized",
    "shape.generation.advanced",
    "shape.generation.certificate",
    "shape.generation.compiler",
    "shape.generation.core",
    "shape.generation.distribution_fidelity",
    "shape.generation.evolution",
    "shape.generation.geo_fidelity",
    "shape.generation.joint",
    "shape.generation.relational",
    "shape.generation.relational_fidelity",
    "shape.generation.release",
    "shape.generation.strategies",
    "shape.generation.timeline",
    "shape.generation.vectorized",
    "shape.geospatial.core",
    "shape.location.core",
    "shape.location.reference",
    "shape.packs.domains",
    "shape.packs.person",
    "shape.packs.sdk",
    "shape.packs.verify",
    "shape.privacy.advanced",
    "shape.privacy.core",
    "shape.privacy.propagate",
    "shape.quality.core",
    "shape.quality.policy",
    "shape.relations.core",
    "shape.security.crypto",
    "shape.security.hardening",
    "shape.spec.capabilities",
    "shape.spec.io",
    "shape.streaming.aggregate_windows",
    "shape.streaming.core",
    "shape.streaming.failure",
    "shape.streaming.monitor",
    "shape.streaming.online",
    "shape.types",
    "shape.validation",
    "shape.validation.adversarial",
    "shape.validation.fuzz",
    "shape.validation.invariants",
    "shape.validation.statistics",
    "shape.validation.suite",
]
ignore_errors=true

[project.scripts]
shape = "shape.cli.main:main"

[project.entry-points."shape.sources"]
csv = "shape.builtins.sources:CsvSource"
parquet = "shape.builtins.sources:ParquetSource"
jsonl = "shape.builtins.sources:JsonlSource"
ipc = "shape.builtins.sources:IpcSource"
abfss = "shape.builtins.sources:AbfssSource"
delta = "shape.builtins.sources:DeltaSource"

[project.entry-points."shape.sinks"]
csv = "shape.builtins.sinks:CsvSink"
parquet = "shape.builtins.sinks:ParquetSink"
jsonl = "shape.builtins.sinks:JsonlSink"
ipc = "shape.builtins.sinks:IpcSink"
tsv = "shape.builtins.sinks:TsvSink"
sql = "shape.builtins.sinks:SqlSink"
excel = "shape.builtins.sinks:ExcelSink"
delta = "shape.builtins.sinks:DeltaSink"

[project.entry-points."shape.emitters"]
console = "shape.builtins.emitters:ConsoleEmitter"
file = "shape.builtins.emitters:FileEmitter"
jsonl = "shape.builtins.emitters:JsonlEmitter"

[project.entry-points."shape.detectors"]
email = "shape.builtins.detectors:EmailDetector"
us_ssn = "shape.builtins.detectors:UsSsnDetector"
phone = "shape.builtins.detectors:PhoneDetector"
