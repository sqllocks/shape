[project.entry-points."shape.fitters"]
auto = "shape.builtins.fitters:AutoFitter"

[project.entry-points."shape.strategies"]
constant = "shape.builtins.strategies:Constant"
sequence = "shape.builtins.strategies:Sequence"
choice = "shape.builtins.strategies:Choice"
uniform = "shape.builtins.strategies:Uniform"
normal = "shape.builtins.strategies:Normal"
native = "shape.builtins.strategies.providers:Native"
faker = "shape.builtins.strategies.providers:Faker"
formula = "shape.builtins.strategies.formula:Formula"
derived = "shape.builtins.strategies.derived:Derived"
computed = "shape.builtins.strategies.derived:Computed"
address = "shape.builtins.strategies:AddressStrategy"
uuid = "shape.builtins.strategies.basic:Uuid"
weighted_enum = "shape.builtins.strategies.basic:WeightedEnum"
distribution = "shape.builtins.strategies.numeric:Distribution"
empirical = "shape.builtins.strategies.numeric:Empirical"
pattern = "shape.builtins.strategies.text:Pattern"
lookup = "shape.builtins.strategies.linked:Lookup"
conditional = "shape.builtins.strategies.linked:Conditional"
correlated = "shape.builtins.strategies.linked:Correlated"
reference_data = "shape.builtins.strategies.reference_data:ReferenceData"
record_sample = "shape.builtins.strategies.reference_data:RecordSample"
record_field = "shape.builtins.strategies.reference_data:RecordField"
bootstrap = "shape.builtins.strategies.bootstrap:Bootstrap"
temporal = "shape.builtins.strategies.temporal:Temporal"
foreign_key = "shape.builtins.strategies.keys:ForeignKey"
composite_foreign_key = "shape.builtins.strategies.keys:CompositeForeignKey"
composite_fk_field = "shape.builtins.strategies.keys:CompositeFkField"
first_per_parent = "shape.builtins.strategies.groups:FirstPerParent"
