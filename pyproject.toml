[project.entry-points."shape.chaos"]
schema = "shape.builtins.chaos:SchemaChaos"
value = "shape.builtins.chaos:ValueChaos"
file = "shape.builtins.chaos:FileChaos"
referential = "shape.builtins.chaos:ReferentialChaos"
temporal = "shape.builtins.chaos:TemporalChaos"
