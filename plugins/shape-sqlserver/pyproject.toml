[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-sqlserver"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.1"
description = "Shape plugin: SQL Server, Azure SQL and Fabric SQL database profiling and source"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = ["sqllocks-shape==0.9.1", "pyodbc>=5.0"]

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
Documentation = "https://github.com/sqllocks/shape/tree/main/plugins/shape-sqlserver"

[project.optional-dependencies]
# Microsoft Entra authentication (--auth cli | msi | spn).
entra = ["azure-identity>=1.16.1"]

[project.entry-points."shape.sources"]
mssql = "shape_sqlserver:SqlServerSource"

[project.entry-points."shape.commands"]
profile-db = "shape_sqlserver:ProfileDbCommand"

[tool.setuptools.packages.find]
where = ["src"]
