[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-dbt"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.1"
description = "Shape plugin: dbt integration (import a dbt project, compile contracts to dbt tests, dbt seeds sink)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
# dbt itself is not a dependency: the plugin reads and writes dbt's files and never runs dbt.
dependencies = ["sqllocks-shape==0.9.1", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
Documentation = "https://github.com/sqllocks/shape/tree/main/plugins/shape-dbt"

[project.entry-points."shape.commands"]
from-dbt = "shape_dbt:FromDbt"
to-dbt-tests = "shape_dbt:ToDbtTests"
dbt-seeds = "shape_dbt:DbtSeeds"
dbt-report = "shape_dbt:DbtReport"

[project.entry-points."shape.sinks"]
dbt-seeds = "shape_dbt:DbtSeedsSink"

[tool.setuptools.packages.find]
where = ["src"]
