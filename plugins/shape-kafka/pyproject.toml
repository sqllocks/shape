[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-kafka"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.0"
description = "Shape plugin: Kafka stream source and event emitter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["sqllocks-shape==0.9.0", "confluent-kafka>=2.5,<4"]

[project.entry-points."shape.stream_sources"]
kafka = "shape_kafka:KafkaStreamSource"

[project.entry-points."shape.emitters"]
kafka = "shape_kafka:KafkaEmitter"

[tool.setuptools.packages.find]
where = ["src"]
