[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-kafka"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.1"
description = "Shape plugin: Kafka stream source and event emitter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
# No musllinux wheels: 2.14.2 builds with Alpine's librdkafka 2.14.1.
# 2.15+ needs a newer native library than Alpine supplies; keep [kafka]/[all] installable.
dependencies = ["sqllocks-shape==0.9.1", "confluent-kafka>=2.5,<2.15"]

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
Documentation = "https://github.com/sqllocks/shape/tree/main/plugins/shape-kafka"

[project.optional-dependencies]
avro = ["fastavro>=1.9"]
protobuf = ["protobuf>=5"]

[project.entry-points."shape.stream_sources"]
kafka = "shape_kafka:KafkaStreamSource"

[project.entry-points."shape.emitters"]
kafka = "shape_kafka:KafkaEmitter"

[tool.setuptools.packages.find]
where = ["src"]
