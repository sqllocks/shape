[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-eventhubs"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.0"
description = "Shape plugin: Azure Event Hubs stream source"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["sqllocks-shape==0.9.0", "azure-eventhub>=5.12,<6"]

[project.optional-dependencies]
# Microsoft Entra sign-in instead of a connection string.
entra = ["azure-identity>=1.15"]

[project.entry-points."shape.stream_sources"]
eventhubs = "shape_eventhubs:EventHubsStreamSource"

[tool.setuptools.packages.find]
where = ["src"]
