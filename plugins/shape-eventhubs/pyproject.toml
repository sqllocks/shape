[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sqllocks-shape-eventhubs"
# Lockstep with core (T-09): scripts/check_plugin_skeletons.py fails when this drifts.
version = "0.9.3"
description = "Shape plugin: Azure Event Hubs stream source and event emitter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
dependencies = ["sqllocks-shape==0.9.3", "azure-eventhub>=5.12,<6"]

[project.urls]
Homepage = "https://github.com/sqllocks/shape"
Repository = "https://github.com/sqllocks/shape"
Issues = "https://github.com/sqllocks/shape/issues"
Documentation = "https://github.com/sqllocks/shape/tree/main/plugins/shape-eventhubs"

[project.optional-dependencies]
avro = ["fastavro>=1.9"]
protobuf = ["protobuf>=5"]
schema-registry = ["azure-schemaregistry-avroencoder>=1.0,<2", "fastavro>=1.9"]
# Microsoft Entra sign-in instead of a connection string.
entra = ["azure-identity>=1.16.1"]

[project.entry-points."shape.stream_sources"]
eventhubs = "shape_eventhubs:EventHubsStreamSource"

[project.entry-points."shape.emitters"]
eventhubs = "shape_eventhubs:EventHubsEmitter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
sqllocks-shape = { workspace = true }
