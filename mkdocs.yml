site_name: Shape by SQLLocks
site_description: Shape as Code — a portable, executable description of how data behaves.
site_url: https://docs.shapedata.ai/
repo_url: https://github.com/sqllocks/shape
repo_name: sqllocks/shape
copyright: Copyright SQLLocks. Released under the MIT license.
docs_dir: docs
site_dir: site
strict: true
exclude_docs: 'plans/

  talks/

  '
hooks:
- scripts/mkdocs_hooks.py
validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  font: false
  logo: assets/brand/shape-logo.svg
  favicon: assets/brand/shape-mark.svg
  features:
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - search.suggest
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Light mode
  custom_dir: site_overrides
markdown_extensions:
- admonition
- attr_list
- def_list
- footnotes
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: shape-mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
- assets/stylesheets/brand.css
extra_javascript:
- assets/javascripts/diagrams.js
