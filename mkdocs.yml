# The documentation site (P8-03, T-24). Build with `mkdocs build --strict`; check links with
# `python scripts/check_doc_links.py`. Two pages are generated at build time by
# `scripts/mkdocs_hooks.py`: the CLI reference (from the argparse parser) and the performance
# page (from the committed benchmark results).
site_name: Shape by SQLLocks
site_description: Shape as Code — a portable, executable description of how data behaves.
site_url: https://sqllocks.github.io/shape/
repo_url: https://github.com/sqllocks/shape
repo_name: sqllocks/shape
edit_uri: edit/main/docs/
copyright: Copyright SQLLocks. Released under the MIT license.

docs_dir: docs
site_dir: site
strict: true

# Internal planning material and talk rehearsal files are not part of the site.
exclude_docs: |
  plans/
  talks/

hooks:
  - scripts/mkdocs_hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

