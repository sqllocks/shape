# Emulators for the `emulator`-marked tests (T-26). They run only in the nightly GitHub Actions
# jobs; builder sessions usually have no Docker daemon, so locally run
# `pytest -m "not emulator and not live"`.
#
#   docker compose -f ci/emulators/docker-compose.yml up -d --wait
#   pytest -m emulator
#   docker compose -f ci/emulators/docker-compose.yml down -v
#
# Endpoints (host side):
#   Kafka                    localhost:9092
#   Event Hubs emulator      Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
#                            (AMQP 5672, management 5300; hub `eh1` from Config.json)
#   Kusto emulator           http://localhost:8080 (database NetDefaultDB, no sign-in; amd64;
#                            the Fabric Eventhouse emitter's streaming ingestion; no healthcheck:
#                            the tests wait for it)
#   SQL Server 2022          localhost,1433  user sa, password from MSSQL_SA_PASSWORD below
#                            (tests need `msodbcsql18`, installed on the runner)
#   PostgreSQL 16            localhost:5432  user shape, password shape_emulator, database shape
#   MySQL 8.4                localhost:3306  user shape, password shape_emulator, database shape
#                            (the sink tests also use root, same password, to create schemas)
name: shape-emulators

services:
  kafka:
    # Single-node KRaft broker, no ZooKeeper.
    image: confluentinc/cp-kafka:7.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  azurite:
    # Storage backend the Event Hubs emulator requires.
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000", "10001:10001", "10002:10002"]

  eventhubs:
    # amd64 only. Config.json declares namespace `emulatorNs1` with hub `eh1` (4 partitions).
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    platform: linux/amd64
    depends_on: [azurite]
    ports: ["5672:5672", "5300:5300"]
    volumes:
      - ./eventhubs/Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"

  kusto:
    # Kusto emulator (kustainer): streaming ingestion and the query API on 8080. amd64 only.
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
    platform: linux/amd64
    ports: ["8080:8080"]
    environment:
      ACCEPT_EULA: "Y"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["1433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Shape_Emulator_1"
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: shape
      POSTGRES_PASSWORD: shape_emulator
      POSTGRES_DB: shape
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shape -d shape"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: shape_emulator
      MYSQL_USER: shape
      MYSQL_PASSWORD: shape_emulator
      MYSQL_DATABASE: shape
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  iceberg-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${SHAPE_ICEBERG_ACCESS_KEY:-shape_emulator}
      MINIO_ROOT_PASSWORD: ${SHAPE_ICEBERG_SECRET_KEY:-shape_emulator_secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  iceberg-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      iceberg-minio: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${SHAPE_ICEBERG_ACCESS_KEY:-shape_emulator}
      AWS_SECRET_ACCESS_KEY: ${SHAPE_ICEBERG_SECRET_KEY:-shape_emulator_secret}
    entrypoint: ["/bin/sh", "-c"]
    command: ['mc alias set local http://iceberg-minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" && mc mb --ignore-existing local/warehouse']

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.0
    ports: ["8181:8181"]
    depends_on:
      iceberg-minio-init: {condition: service_completed_successfully}
    environment:
      AWS_ACCESS_KEY_ID: ${SHAPE_ICEBERG_ACCESS_KEY:-shape_emulator}
      AWS_SECRET_ACCESS_KEY: ${SHAPE_ICEBERG_SECRET_KEY:-shape_emulator_secret}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://iceberg-minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
