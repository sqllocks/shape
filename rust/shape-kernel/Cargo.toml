[package]
name = "shape-kernel"
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native kernel of sqllocks-shape (exposed to Python as shape._kernel)"
publish = false

[lib]
name = "_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versions pinned by plan decision T-02: one known-compatible set.
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
pyo3-arrow = "0.19"
arrow-array = "59"
arrow-buffer = "59"
arrow-data = "59"
arrow-schema = "59"
rayon = "1.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex = "1"
half = "2"

[profile.release]
lto = "thin"
codegen-units = 1
