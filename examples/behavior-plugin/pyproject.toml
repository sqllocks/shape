[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-example-behavior"
version = "0.1.0"
description = "Example Shape plugin: a behavior module added through shape.behaviors"
requires-python = ">=3.11"
dependencies = ["sqllocks-shape", "sqllocks-shape-behavior"]

[project.entry-points."shape.behaviors"]
library_loans = "shape_example_behavior:LibraryLoans"

[tool.setuptools.packages.find]
where = ["src"]
