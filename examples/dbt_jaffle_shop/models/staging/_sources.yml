version: 2

# The raw tables. `shape from-dbt` reads this file: unique + not_null give the keys,
# relationships give the foreign keys, accepted_values give the enums, data_type the types.
sources:
  - name: raw
    schema: main
    description: Raw shop data, loaded as dbt seeds (`shape dbt-seeds`) in this project.
    tables:
      - name: raw_customers
        description: One row per customer.
        columns:
          - name: customer_id
            description: Primary key.
            data_type: bigint
            data_tests: [unique, not_null]
          - name: first_name
            data_type: varchar
          - name: last_name
            data_type: varchar
      - name: raw_orders
        description: One row per order.
        columns:
          - name: order_id
            description: Primary key.
            data_type: bigint
            data_tests: [unique, not_null]
          - name: customer_id
            description: The customer who placed the order.
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_customers')
                    field: customer_id
          - name: order_date
            data_type: date
            data_tests: [not_null]
          - name: status
            description: Where the order is in its life.
            data_type: varchar
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [placed, shipped, completed, return_pending, returned]
      - name: raw_payments
        description: One row per payment of an order.
        columns:
          - name: payment_id
            description: Primary key.
            data_type: bigint
            data_tests: [unique, not_null]
          - name: order_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'raw_orders')
                    field: order_id
          - name: payment_method
            data_type: varchar
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [credit_card, coupon, bank_transfer, gift_card]
          - name: amount
            description: The amount paid, in dollars.
            data_type: numeric(10,2)
            data_tests: [not_null]
