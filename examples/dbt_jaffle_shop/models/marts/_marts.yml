version: 2

models:
  - name: orders
    description: One row per order, with the amount paid.
    config:
      contract: {enforced: true}
    columns:
      - name: order_id
        data_type: bigint
        data_tests: [unique, not_null]
      - name: customer_id
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('customers'), field: customer_id}
      - name: order_date
        data_type: date
      - name: status
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [placed, shipped, completed, return_pending, returned]
      - name: amount
        data_type: decimal(18,2)
  - name: customers
    description: One row per customer, with their orders.
    config:
      contract: {enforced: true}
    columns:
      - name: customer_id
        data_type: bigint
        data_tests: [unique, not_null]
      - name: first_name
        data_type: varchar
      - name: last_name
        data_type: varchar
      - name: first_order
        data_type: date
      - name: most_recent_order
        data_type: date
      - name: number_of_orders
        data_type: bigint
      - name: customer_lifetime_value
        data_type: decimal(18,2)
